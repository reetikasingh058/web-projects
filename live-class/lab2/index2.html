<div>

     <button  style ="padding:9px" id="sub">-</button>

       <button  style ="padding:9px" id="div">/</button>
</div>

<div>
   <button id="calculate">Calculate</button>
</div>
<h2 id="output">Result: 0</h2>




    </div>
